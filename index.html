<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Erik's Training</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--teal:#1EC8B0;--teal-dim:rgba(30,200,176,.15);--teal-border:rgba(30,200,176,.25);--bg:#090d0d;--card:#101918;--card2:#141f1e;--border:#1a2826;--muted:#3d5c59;--muted2:#6b8c88;--text:#ffffff;--red:#e8554a;--yellow:#f0b429;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;overscroll-behavior:none;}
.bar{position:sticky;top:0;z-index:10;background:rgba(9,13,13,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 22px 14px;display:flex;align-items:center;justify-content:space-between;}
.bar-left h1{font-size:.95rem;font-weight:800;color:#fff;letter-spacing:-.3px;}
.bar-left h1 span{color:var(--teal);}
.bar-date{font-size:.68rem;color:var(--muted2);margin-top:2px;letter-spacing:.2px;}
.mode-pill{display:flex;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.mode-pill button{background:none;border:none;color:var(--muted2);font-size:.68rem;font-weight:800;padding:7px 13px;cursor:pointer;font-family:inherit;-webkit-appearance:none;letter-spacing:.5px;}
.mode-pill button.on-bulk{background:var(--teal);color:#000;border-radius:20px;}
.mode-pill button.on-cut{background:var(--red);color:#fff;border-radius:20px;}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,13,13,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:none;border:none;color:var(--muted);font-size:.6rem;font-weight:700;cursor:pointer;-webkit-appearance:none;letter-spacing:.5px;text-transform:uppercase;}
.ntab .ni{font-size:1.2rem;line-height:1;}
.ntab.on{color:var(--teal);}
.pg{display:none;padding:24px 20px 110px;}
.pg.on{display:block;}
.reminder-banner{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.3);border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:.84rem;color:var(--yellow);line-height:1.55;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.reminder-banner button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;flex-shrink:0;line-height:1;}
.day-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:22px;}
.day-tabs::-webkit-scrollbar{display:none;}
.dtab{flex-shrink:0;background:var(--card);border:1px solid var(--border);color:var(--muted2);padding:8px 14px;border-radius:100px;font-size:.72rem;font-weight:700;cursor:pointer;-webkit-appearance:none;white-space:nowrap;letter-spacing:.3px;font-family:inherit;}
.dtab.today-marker{border-color:var(--teal);}
.dtab.on{background:var(--teal);color:#000;border-color:var(--teal);}
.bw-block{margin-bottom:28px;}
.bw-label{font-size:.65rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.bw-num{font-size:3.2rem;font-weight:900;color:#fff;line-height:1;letter-spacing:-2px;margin-bottom:12px;}
.bw-num span{font-size:1.4rem;font-weight:600;color:var(--muted2);letter-spacing:0;margin-left:4px;}
.bw-num.empty{font-size:2rem;color:var(--muted);letter-spacing:-1px;}
.bw-row{display:flex;gap:10px;align-items:center;}
.bw-inp{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:1rem;font-family:inherit;padding:12px 16px;-webkit-appearance:none;outline:none;}
.bw-inp:focus{border-color:var(--teal);}
.bw-btn{background:var(--teal);color:#000;border:none;border-radius:12px;padding:12px 22px;font-size:.85rem;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;white-space:nowrap;}
.day-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.day-hdr-left{display:flex;align-items:center;gap:8px;}
.day-hdr-label{font-size:.65rem;font-weight:800;color:var(--muted2);text-transform:uppercase;letter-spacing:2px;}
.day-split-name{font-size:1.4rem;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:18px;}
.day-edit-btn{background:none;border:1px solid var(--border);color:var(--muted2);border-radius:8px;padding:5px 11px;font-size:.68rem;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none;white-space:nowrap;}
.lift-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.lift-card.done-card{border-color:var(--teal-border);background:var(--teal-dim);}
@keyframes tealPulse{0%,100%{border-color:var(--yellow);box-shadow:0 0 0 0 rgba(240,180,41,0);}50%{border-color:#ffe080;box-shadow:0 0 20px 4px rgba(240,180,41,.15);}}
.lift-card.bump-card{animation:tealPulse 2.2s ease-in-out infinite;}
.lc-name{font-size:.62rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;}
.lc-target{font-size:1.35rem;font-weight:900;color:#fff;line-height:1.3;letter-spacing:-.4px;}
.lc-target.cut-t{color:#6ab4ff;}
.lc-last{font-size:.72rem;color:var(--muted);margin-top:6px;}
.badge{display:inline-block;font-size:.58rem;font-weight:800;padding:3px 8px;border-radius:6px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;}
.badge.bump{background:rgba(240,180,41,.15);color:var(--yellow);border:1px solid rgba(240,180,41,.3);}
.badge.maint{background:rgba(106,180,255,.12);color:#6ab4ff;border:1px solid rgba(106,180,255,.25);}
.badge.done{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-border);}
.lc-right{flex-shrink:0;margin-left:16px;display:flex;flex-direction:column;gap:8px;}
.log-btn{background:var(--teal);color:#000;border:none;border-radius:12px;padding:12px 20px;font-size:.85rem;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.log-btn.edit-btn{background:var(--card2);border:1px solid var(--teal);color:var(--teal);}
.log-btn:active{opacity:.8;}
.setlvl-btn{background:none;border:1px solid var(--border);color:var(--muted2);border-radius:10px;padding:7px 12px;font-size:.68rem;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.rest-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:48px 24px;text-align:center;}
.rest-card .ri{font-size:2.8rem;margin-bottom:14px;}
.rest-card .rt{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:8px;}
.rest-card .rs{font-size:.88rem;color:var(--muted2);line-height:1.6;}
.pg-title{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:24px;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:20px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;background:var(--card);border:1px solid var(--border);color:var(--muted2);padding:9px 18px;border-radius:100px;font-size:.75rem;font-weight:700;cursor:pointer;-webkit-appearance:none;white-space:nowrap;letter-spacing:.3px;}
.chip.on{background:var(--teal);color:#000;border-color:var(--teal);}
.chip.on-bw{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 10px;text-align:center;}
.stat .sv{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1;}
.stat .sv small{font-size:.75rem;font-weight:600;color:var(--muted2);letter-spacing:0;}
.stat .sl{font-size:.58rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:5px;}
.stat .sn{font-size:.65rem;font-weight:600;color:var(--teal);margin-top:3px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px;}
.chart-label{font-size:.6rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px;}
.chart-title{font-size:.92rem;font-weight:800;color:#fff;margin-bottom:14px;letter-spacing:-.2px;}
.chart-wrap{position:relative;height:200px;}
.no-data-msg{text-align:center;color:var(--muted2);padding:32px 16px;font-size:.88rem;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;}
.modal-bg.on{display:flex;}
.modal-sheet{background:#111b1a;border-radius:24px 24px 0 0;padding:28px 22px 42px;width:100%;border-top:1px solid var(--border);max-height:92vh;overflow-y:auto;}
.modal-sheet h3{font-size:1.1rem;font-weight:800;margin-bottom:4px;letter-spacing:-.3px;}
.modal-sub{font-size:.78rem;color:var(--muted2);margin-bottom:20px;line-height:1.5;}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.mcx{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:15px;font-size:.9rem;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:inherit;}
.msv{background:var(--teal);color:#000;border:none;border-radius:14px;padding:15px;font-size:.9rem;font-weight:800;cursor:pointer;-webkit-appearance:none;font-family:inherit;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:.62rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px;}
.field select,.field input[type=number],.field input[type=date]{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:1rem;font-family:inherit;padding:15px 18px;-webkit-appearance:none;outline:none;}
.field input:focus{border-color:var(--teal);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.qreps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qr{background:var(--card2);border:1px solid var(--border);color:var(--muted2);padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.qr.hi{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);font-weight:800;}
.tgt-box{border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.tgt-box.bulk{background:var(--teal-dim);border:1px solid var(--teal-border);}
.tgt-box.cut{background:rgba(106,180,255,.08);border:1px solid rgba(106,180,255,.2);}
.tgt-box.bump{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);}
.tgt-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.tgt-box.bulk .tgt-label{color:var(--teal);}
.tgt-box.cut .tgt-label{color:#6ab4ff;}
.tgt-box.bump .tgt-label{color:var(--yellow);}
.tgt-val{font-size:1.05rem;font-weight:900;letter-spacing:-.3px;}
.tgt-box.bulk .tgt-val{color:var(--teal);}
.tgt-box.cut .tgt-val{color:#6ab4ff;}
.tgt-box.bump .tgt-val{color:var(--yellow);}
.queue-list{margin:10px 0 0;display:flex;flex-direction:column;gap:8px;}
.queue-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.queue-item-lift{font-size:.72rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;}
.queue-item-set{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.3px;margin-top:2px;}
.queue-remove{background:none;border:1px solid var(--border);color:var(--muted2);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer;font-family:inherit;-webkit-appearance:none;flex-shrink:0;}
.queue-hdr{font-size:.62rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;}
.add-set-btn{width:100%;background:var(--card2);border:1px solid var(--teal);color:var(--teal);border-radius:16px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;margin-top:6px;}
.save-sess-btn{width:100%;background:var(--teal);color:#000;border:none;border-radius:16px;padding:17px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;-webkit-appearance:none;margin-top:10px;}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.split-opt{background:var(--card2);border:2px solid var(--border);color:var(--text);border-radius:14px;padding:18px 10px;font-size:.95rem;font-weight:700;cursor:pointer;-webkit-appearance:none;font-family:inherit;text-align:center;}
.split-opt.active{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}
.split-reset{width:100%;background:none;border:1px solid var(--border);color:var(--muted2);border-radius:12px;padding:12px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;}
</style>
</head>
<body>
<!-- SIGN-IN OVERLAY -->
<div id="signinOverlay" style="display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;">
  <div style="font-size:3.5rem;margin-bottom:16px;">&#127947;</div>
  <div style="font-size:1.9rem;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:8px;">Erik's Training</div>
  <div style="font-size:.9rem;color:var(--muted2);margin-bottom:52px;max-width:260px;line-height:1.6;">Sign in with Google to sync your lifts across all devices</div>
  <button onclick="signIn()" style="display:flex;align-items:center;gap:12px;background:#fff;color:#111;border:none;border-radius:16px;padding:16px 28px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.4);">
    <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.2 30.3 0 24 0 14.8 0 7 5.4 3.2 13.3l7.8 6.1C12.9 13.1 18 9.5 24 9.5z"/><path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M11 28.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4L3.2 13.3C1.2 17.1 0 21.4 0 24s1.2 6.9 3.2 10.7L11 28.4z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.6l-7.5-5.8c-2.1 1.4-4.8 2.2-8 2.2-6 0-11.1-3.6-13-8.8L3.2 36.3C7 43.8 14.8 48 24 48z"/></svg>
    Sign in with Google
  </button>
  <div id="signinStatus" style="margin-top:20px;font-size:.8rem;color:var(--muted2);"></div>
</div>
<!-- TOP BAR -->
<div class="bar">
  <div class="bar-left">
    <h1>Erik's <span>Training</span></h1>
    <div class="bar-date" id="topDate"></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="userLabel" style="font-size:.7rem;color:var(--muted2);cursor:pointer;" onclick="doSignOut()">Sign out</span>
    <div class="mode-pill">
      <button id="bBulk" onclick="setMode('bulk')">BULK</button>
      <button id="bCut"  onclick="setMode('cut')">CUT</button>
    </div>
  </div>
</div>
<!-- TODAY -->
<div class="pg on" id="pg-today">
  <div id="reminderBanner" class="reminder-banner" style="display:none">
    <span id="reminderMsg"></span>
    <button onclick="dismissReminder()">&#10005;</button>
  </div>
  <div class="bw-block">
    <div class="bw-label">Body Weight</div>
    <div class="bw-num" id="bwDisplay">&#8212;</div>
    <div class="bw-row">
      <input class="bw-inp" id="bwInp" type="number" placeholder="Enter weight in lbs" inputmode="decimal" step="0.5">
      <button class="bw-btn" onclick="saveBW()">Log</button>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="dayHeader"></div>
  <div id="liftCards"></div>
</div>
<!-- PROGRESS -->
<div class="pg" id="pg-progress">
  <div class="pg-title">Progress</div>
  <div class="chips" id="progChips"></div>
  <div class="stat-row" id="progStats"></div>
  <div class="chart-card">
    <div class="chart-label">All-Time</div>
    <div class="chart-title" id="chart1Title"></div>
    <div class="chart-wrap"><canvas id="chart1"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-label">This Month</div>
    <div class="chart-title" id="chart2Title"></div>
    <div id="monthStats" class="stat-row" style="margin-top:12px;margin-bottom:16px"></div>
    <div class="chart-wrap" id="chart2Wrap"><canvas id="chart2"></canvas></div>
    <div id="chart2Empty" class="no-data-msg" style="display:none">No sessions this month yet</div>
  </div>
</div>
<!-- BOTTOM NAV -->
<div class="nav">
  <button class="ntab on" id="nt-today"    onclick="goPage('today')">    <span class="ni">&#127968;</span>Today</button>
  <button class="ntab"    id="nt-progress" onclick="goPage('progress')"> <span class="ni">&#128200;</span>Progress</button>
</div>
<!-- LOG SESSION MODAL -->
<div class="modal-bg" id="logModalBg" onclick="if(event.target===this)closeLogModal()">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 id="logModalTitle">Log Session</h3>
      <button onclick="closeLogModal()" style="background:none;border:none;color:var(--muted2);font-size:1.3rem;cursor:pointer;line-height:1;">&#10005;</button>
    </div>
    <div id="logModalTarget"></div>
    <div class="field"><label>Date</label><input type="date" id="logDate"></div>
    <div class="two">
      <div class="field"><label id="logWLbl">Weight (lbs)</label><input type="number" id="logW" inputmode="decimal" min="0" step="2.5"></div>
      <div class="field"><label>Reps</label><input type="number" id="logR" inputmode="numeric" min="1" placeholder="&#8212;"><div class="qreps" id="logQreps"></div></div>
    </div>
    <button class="add-set-btn" onclick="addLogSet()">+ Add Set</button>
    <div id="logQueueWrap" style="display:none">
      <div class="queue-hdr"><span id="logQueueCount">0 sets</span><button onclick="clearLogQueue()" style="background:none;border:none;color:var(--muted);font-size:.72rem;cursor:pointer;font-family:inherit;">Clear all</button></div>
      <div class="queue-list" id="logQueueList"></div>
    </div>
    <button class="save-sess-btn" onclick="saveLogSession()">Save Session</button>
  </div>
</div>
<!-- CHANGE SPLIT MODAL -->
<div class="modal-bg" id="splitModalBg" onclick="if(event.target===this)closeSplitModal()">
  <div class="modal-sheet">
    <h3>Change Workout</h3>
    <p class="modal-sub" id="splitModalDay"></p>
    <div class="split-grid" id="splitGrid">
      <button class="split-opt" onclick="setSplit('Push')">&#127947; Push</button>
      <button class="split-opt" onclick="setSplit('Pull')">&#128170; Pull</button>
      <button class="split-opt" onclick="setSplit('Legs')">&#129466; Legs</button>
      <button class="split-opt" onclick="setSplit('Rest')">&#128164; Rest</button>
    </div>
    <button class="split-reset" onclick="resetSplit()">&#8635; Reset to default</button>
    <button class="mcx" style="width:100%" onclick="closeSplitModal()">Cancel</button>
  </div>
</div>
<!-- SET LEVEL MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeMod()">
  <div class="modal-sheet">
    <h3 id="mTitle">Set Level</h3>
    <p class="modal-sub">Override where you are on this lift. Targets will recalculate.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label id="mWLbl">Weight (lbs)</label><input type="number" id="mW" inputmode="decimal" min="0" step="2.5"></div>
      <div class="field"><label>Reps</label><input type="number" id="mR" inputmode="numeric" min="1" max="20"></div>
    </div>
    <div class="modal-btns">
      <button class="mcx" onclick="closeMod()">Cancel</button>
      <button class="msv" onclick="saveBL()">Save</button>
    </div>
  </div>
</div>
<script>

function dAgo(d){if(!d)return 999;return Math.round((Date.now()-new Date(d+'T12:00:00').getTime())/86400000);}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}

function getSchedule(dow){return customSched[dow]!==undefined?customSched[dow]:DEF_SCHED[dow];}
function dateForDow(dow){const d=new Date(),todayDow=d.getDay();let diff=dow-todayDow;if(diff>0)diff-=7;d.setDate(d.getDate()+diff);return d.toISOString().split('T')[0];}
function lastSess(l){const s=data[l]||[];if(!s.length)return null;return s.reduce((a,b)=>a.date>=b.date?a:b);}
function loggedOnDate(l,date){return(data[l]||[]).some(s=>s.date===date);}
function sessForDate(l,date){return(data[l]||[]).find(s=>s.date===date)||null;}
function fmtSets(l,sets){if(!sets||!sets.length)return'—';const isFBW=l==='Leg Raises'||l==='45 Degree Sit-Ups';const isPU=l==='Pull-Ups';const w0=sets[0].w;const wStr=isFBW?'BW':isPU?(w0===0?'BW':`+${w0}lb`):`${w0}lb`;if(sets.length===1)return`${wStr} × ${sets[0].r}`;return`${wStr} × ${sets.map(s=>s.r).join(', ')}`;}
function target(l){const sess=lastSess(l),bll=bl[l];let srcSets=null;if(sess&&bll){srcSets=sess.date>=bll.date?sess.sets:[{w:bll.w,r:bll.r}];}else if(sess){srcSets=sess.sets;}else if(bll){srcSets=[{w:bll.w,r:bll.r}];}if(!srcSets){const d=DEFAULTS[l]||{w:0,r:6};return{sets:[{w:d.w,r:d.r}],bump:false,maint:false};}if(mode==='cut')return{sets:srcSets.map(s=>({...s})),bump:false,maint:true};const allMax=srcSets.every(s=>s.r>=MAX);if(allMax){const inc=INC[l];if(inc===0)return{sets:srcSets.map(s=>({w:s.w,r:s.r+1})),bump:false,maint:false};const nw=srcSets[0].w+inc;return{sets:srcSets.map(s=>({w:nw,r:RST})),bump:true,prev:srcSets[0].w,maint:false};}return{sets:srcSets.map(s=>({w:s.w,r:Math.min(s.r+1,MAX)})),bump:false,maint:false};}

 class="log-btn" onclick="openLogModal('${l}','${dateStr}')">Log</button><button class="setlvl-btn" onclick="openMod('${l}')">Set level</button></div></div>`;}).join('');}
function checkReminder(){const todayDate=today(),realDow=new Date().getDay(),yest=new Date(Date.now()-86400000).toISOString().split('T')[0],yestDow=(realDow+6)%7;const banner=document.getElementById('reminderBanner'),msg=document.getElementById('reminderMsg');let text='';const todaySplit=getSchedule(realDow);if(todaySplit!=='Rest'){const anyToday=SPLITS[todaySplit].some(l=>loggedOnDate(l,todayDate));if(!anyToday)text=`&#128170; Don't forget your ${todaySplit} workout today!`;}if(!text){const yestSplit=getSchedule(yestDow);if(yestSplit!=='Rest'){const anyYest=SPLITS[yestSplit].some(l=>loggedOnDate(l,yest));if(!anyYest)text=`&#9888; You didn't log ${DAY_NAMES[yestDow]}'s ${yestSplit} workout. Want to add it?`;}}if(text){msg.innerHTML=text;banner.style.display='flex';}else{banner.style.display='none';}}

function renderProgress(){const all=[{id:'bw',label:'⚖️ Body Weight'},...ALL.map(l=>({id:l,label:l}))];document.getElementById('progChips').innerHTML=all.map(c=>`<button class="chip ${c.id===activeLift?(c.id==='bw'?'on-bw':'on'):''}" onclick="setLift('${c.id}')">${c.label}</button>`).join('');activeLift==='bw'?renderBWCharts():renderLiftCharts(activeLift);}
function setLift(l){activeLift=l;renderProgress();}
function renderBWCharts(){const all=Object.entries(bwLog).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,v])=>({date:d,v}));const prefix=today().substring(0,7);const month=all.filter(e=>e.date.startsWith(prefix));document.getElementById('chart1Title').textContent='Body Weight — All-Time';document.getElementById('chart2Title').textContent='Body Weight — This Month';if(all.length){const vals=all.map(e=>e.v),cur=vals[vals.length-1],lo=Math.min(...vals),chg=(cur-vals[0]).toFixed(1);document.getElementById('progStats').innerHTML=`<div class="stat"><div class="sv">${cur}<small>lb</small></div><div class="sl">Current</div></div><div class="stat"><div class="sv">${lo}<small>lb</small></div><div class="sl">Low</div></div><div class="stat"><div class="sv">${chg>0?'+'+chg:chg}<small>lb</small></div><div class="sl">Change</div></div>`;chart1=drawChart('chart1',all.map(e=>fmt(e.date)),vals,'#7c3aed',null,chart1);}else{document.getElementById('progStats').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted2);padding:16px;font-size:.88rem">Log your weight on the Today tab</div>';if(chart1){chart1.destroy();chart1=null;}}if(month.length){const mv=month.map(e=>e.v),mcur=mv[mv.length-1],mlo=Math.min(...mv);document.getElementById('monthStats').innerHTML=`<div class="stat"><div class="sv">${month.length}</div><div class="sl">Weigh-ins</div></div><div class="stat"><div class="sv">${mcur}<small>lb</small></div><div class="sl">Latest</div></div><div class="stat"><div class="sv">${mlo}<small>lb</small></div><div class="sl">Low</div></div>`;document.getElementById('chart2Wrap').style.display='block';document.getElementById('chart2Empty').style.display='none';chart2=drawChart('chart2',month.map(e=>fmt(e.date)),mv,'#7c3aed',null,chart2);}else{document.getElementById('monthStats').innerHTML='';document.getElementById('chart2Wrap').style.display='none';document.getElementById('chart2Empty').style.display='block';if(chart2){chart2.destroy();chart2=null;}}}
function renderLiftCharts(l){const all=sortSess(data[l]||[]);const prefix=today().substring(0,7);const month=all.filter(s=>s.date.startsWith(prefix));document.getElementById('chart1Title').textContent=`${l} — All-Time`;document.getElementById('chart2Title').textContent=`${l} — This Month`;function sessVal(s){return isBW(l)?s.sets.reduce((sum,x)=>sum+x.r,0):s.sets[0].w;}if(all.length){const vals=all.map(sessVal),cur=vals[vals.length-1],peak=Math.max(...vals),t=target(l);document.getElementById('progStats').innerHTML=`<div class="stat"><div class="sv">${all.length}</div><div class="sl">Sessions</div></div><div class="stat"><div class="sv">${cur}<small>${isBW(l)?'rp':'lb'}</small></div><div class="sl">Current</div><div class="sn">→ ${fmtSets(l,t.sets)}</div></div><div class="stat"><div class="sv">${peak}<small>${isBW(l)?'rp':'lb'}</small></div><div class="sl">Peak</div></div>`;chart1=drawChart('chart1',all.map((_,i)=>`#${i+1}`),vals,'#1EC8B0',vals.map(v=>v===peak?'#f0b429':'#1EC8B0'),chart1);}else{document.getElementById('progStats').innerHTML=`<div style="grid-column:1/-1;text-align:center;color:var(--muted2);padding:16px;font-size:.88rem">No sessions logged for ${l}</div>`;if(chart1){chart1.destroy();chart1=null;}}if(month.length){const mv=month.map(sessVal),mpeak=Math.max(...mv);document.getElementById('monthStats').innerHTML=`<div class="stat"><div class="sv">${month.length}</div><div class="sl">Sessions</div></div><div class="stat"><div class="sv">${mv[mv.length-1]}<small>${isBW(l)?'rp':'lb'}</small></div><div class="sl">Latest</div></div><div class="stat"><div class="sv">${mpeak}<small>${isBW(l)?'rp':'lb'}</small></div><div class="sl">Best</div></div>`;document.getElementById('chart2Wrap').style.display='block';document.getElementById('chart2Empty').style.display='none';chart2=drawChart('chart2',month.map(e=>fmt(e.date)),mv,'#1EC8B0',mv.map(v=>v===mpeak?'#f0b429':'#1EC8B0'),chart2);}else{document.getElementById('monthStats').innerHTML='';document.getElementById('chart2Wrap').style.display='none';document.getElementById('chart2Empty').style.display='block';if(chart2){chart2.destroy();chart2=null;}}}
function drawChart(canvasId,labels,vals,color,dots,existingChart){if(existingChart)existingChart.destroy();const ctx=document.getElementById(canvasId).getContext('2d');const g=ctx.createLinearGradient(0,0,0,180);g.addColorStop(0,color==='#7c3aed'?'rgba(124,58,237,.18)':'rgba(30,200,176,.18)');g.addColorStop(1,'rgba(0,0,0,0)');return new Chart(ctx,{type:'line',data:{labels,datasets:[{data:vals,borderColor:color,backgroundColor:g,borderWidth:2,fill:true,tension:.3,pointBackgroundColor:dots||color,pointBorderColor:'#090d0d',pointBorderWidth:2,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},plugins:{legend:{display:false},tooltip:{backgroundColor:'#111b1a',borderColor:color,borderWidth:1,titleColor:color,bodyColor:'#9ab8b5',padding:12,cornerRadius:10}},scales:{x:{grid:{color:'#141f1e'},ticks:{color:'#3d5c59',maxTicksLimit:7,font:{size:11,family:'Inter'}},border:{color:'#1a2826'}},y:{grid:{color:'#141f1e'},ticks:{color:'#3d5c59',font:{size:11,family:'Inter'}},border:{color:'#1a2826'}}}}});}
</script>
